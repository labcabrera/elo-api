[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "elo-api"
version = "0.1.0"
description = "ELO rating service API"
authors = [ { name = "Repo Owner" } ]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.95.0",
  "uvicorn[standard]>=0.20.0",
  "pydantic>=1.10.0,<3",
  "motor>=3.1",
  "aiokafka>=0.8",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest", "httpx", "pytest-asyncio", "pytest-mock", "ruff", "black"]
